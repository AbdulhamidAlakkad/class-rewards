<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Klassen-Belohnungen</title>
<style>
  :root {
    --teal: #0f9c95;
    --teal-dark: #0b7a75;
    --orange: #ff9f5a;
    --bg: #f1f8f7;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #e05555;
    --warn: #e0a83d;
    --gold: #f5c542;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header {
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    color: white;
    padding: 24px 20px 20px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 14px rgba(15,156,149,0.25);
  }
  .header-subtitle { font-size: 14px; font-weight: 400; opacity: 0.9; margin-top: 4px; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 3px 10px rgba(15,23,42,0.08); }
  .welcome-card { background: linear-gradient(135deg, #ffffff, #eaf7f6); border: 1px solid #d5efec; }
  .btn { display: inline-block; background: var(--teal); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; text-align: center; }
  .btn:hover { background: var(--teal-dark); }
  .btn.secondary { background: #e5e7eb; color: var(--text); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .small-btn { font-size: 12px; padding: 6px 8px; border-radius: 8px; }
  input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; margin-top: 4px; margin-bottom: 10px; font-size: 15px; }
  label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { flex: 1; text-align: center; padding: 10px; background: #e6f4f3; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--teal-dark); font-size: 13px; min-width: 70px; }
  .tab.active { background: var(--teal); color: white; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; gap: 8px; }
  .list-item:last-child { border-bottom: none; }
  .pill { background: #e6f4f3; color: var(--teal-dark); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .reward-card, .group-reward-card { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .reward-icon { font-size: 40px; text-align: center; margin-bottom: 6px; }
  .reward-title { font-weight: 700; font-size: 16px; }
  .reward-desc { color: var(--muted); font-size: 14px; margin: 6px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .small { font-size: 13px; color: var(--muted); }
  .center { text-align: center; }
  .status-pending { color: var(--warn); font-weight: 600; }
  .status-approved { color: var(--teal-dark); font-weight: 600; }
  .status-rejected { color: var(--danger); font-weight: 600; }
  .setup-warning { background: #fff4e5; border: 1px solid #f0c36d; padding: 14px; border-radius: 10px; margin-bottom: 14px; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 16px; }
  .podium-item { text-align: center; background: #f7f7f7; border-radius: 10px; padding: 10px 8px; flex: 1; }
  .podium-1 { order: 2; background: #fff8e0; border: 2px solid var(--gold); }
  .podium-2 { order: 1; background: #f5f5f5; border: 2px solid var(--silver); }
  .podium-3 { order: 3; background: #fbeee0; border: 2px solid var(--bronze); }
  .medal { font-size: 28px; }
  .podium-name { font-weight: 700; font-size: 13px; margin-top: 4px; }
  .podium-points { font-size: 12px; color: var(--muted); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-label { width: 80px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-container { flex: 1; background: #eee; border-radius: 8px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--teal); height: 100%; border-radius: 8px; }
  .bar-value { width: 40px; text-align: right; font-size: 13px; font-weight: 600; }
  .progress-bar { background: #eee; border-radius: 8px; height: 16px; overflow: hidden; margin: 8px 0; }
  .progress-fill { background: var(--orange); height: 100%; border-radius: 8px; }
</style>
</head>
<body>
<header>
  🏆 Klassen-Belohnungen
  <div class="header-subtitle">Gemeinsam Punkte sammeln und Erfolge feiern</div>
</header>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, onValue, push, set, update, remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDEM-eZ0w6LE7hLfA2tIWEd87o7iYaELI",
    authDomain: "class-rewards-95f42.firebaseapp.com",
    databaseURL: "https://class-rewards-95f42-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "class-rewards-95f42",
  };

  const app_ = document.getElementById("app");
  const isConfigured = !Object.values(firebaseConfig).some(v => String(v).includes("YOUR_"));

  if (!isConfigured) {
    app_.innerHTML = `
      <div class="setup-warning">
        <strong>Lasst uns noch ein kleines Setup erledigen</strong>
        <p class="small">Trage oben im Code deine echten Firebase-Konfigurationsdaten ein.</p>
      </div>`;
    throw new Error("Firebase config not set");
  }

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);

  const studentsRef = ref(db, "students");
  const rewardsRef = ref(db, "rewards");
  const groupRewardsRef = ref(db, "groupRewards");
  const requestsRef = ref(db, "requests");
  const settingsRef = ref(db, "settings");
  const classPointsRef = ref(db, "classPoints");
  const pointsLogRef = ref(db, "pointsLog");
  const totalStudentPointsRef = ref(db, "totalStudentPoints");

  const ICONS = {
    pen: "✏️", art: "🎨", pizza: "🍕", game: "🎮", movie: "🎬",
    chair: "🪑", book: "📚", gift: "🎁", star: "⭐", trophy: "🏆",
    candy: "🍬", ball: "⚽", drink: "🥤", medal: "🎖️", music: "🎵"
  };

  const defaultCategories = {
    attendance: { label: "Anwesenheit", points: 2 },
    homework: { label: "Aufgaben", points: 3 },
    participation: { label: "Mitarbeit", points: 2 },
    study: { label: "Lernen/Aktivität", points: 3 },
    rules: { label: "Regeln einhalten", points: 2 },
    quran: { label: "Koran auswendig", points: 5 }
  };

  let students = {};
  let rewards = {};
  let groupRewards = {};
  let requests = {};
  let settings = { teacherPassword: "changeme", categories: defaultCategories };
  let classPoints = { total: 0 };
  let totalStudentPoints = { total: 0 };
  let pointsLog = {};
  let totalStudentPointsLoaded = false;
  let studentsLoaded = false;

  let state = { role: null, teacherTab: "students", studentId: null, studentTab: "points", authStep: null };

  onValue(studentsRef, snap => {
    students = snap.val() || {};
    studentsLoaded = true;
    maybeInitTotalStudentPoints();
    render();
  });
  onValue(rewardsRef, snap => { rewards = snap.val() || {}; render(); });
  onValue(groupRewardsRef, snap => { groupRewards = snap.val() || {}; render(); });
  onValue(requestsRef, snap => { requests = snap.val() || {}; render(); });
  onValue(classPointsRef, snap => {
    const val = snap.val();
    if (val) classPoints = val; else set(classPointsRef, classPoints);
    render();
  });
  onValue(pointsLogRef, snap => { pointsLog = snap.val() || {}; render(); });
  onValue(totalStudentPointsRef, snap => {
    const val = snap.val();
    if (val) { totalStudentPoints = val; totalStudentPointsLoaded = true; }
    else { totalStudentPointsLoaded = false; maybeInitTotalStudentPoints(); }
    render();
  });
  onValue(settingsRef, snap => {
    const val = snap.val();
    if (val) { settings = val; if (!settings.categories) settings.categories = defaultCategories; }
    else set(settingsRef, settings);
    render();
  });

  function maybeInitTotalStudentPoints() {
    if (!totalStudentPointsLoaded && studentsLoaded) {
      const sum = Object.values(students).reduce((s, st) => s + (st.points || 0), 0);
      set(totalStudentPointsRef, { total: sum });
      totalStudentPointsLoaded = true;
    }
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
  }

  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function iconOptions(selected) {
    return Object.entries(ICONS).map(([key, emoji]) =>
      `<option value="${key}" ${selected === key ? "selected" : ""}>${emoji} ${key}</option>`
    ).join("");
  }

  function getTotalPoints() {
    return totalStudentPoints.total || 0;
  }

  function goHome() { state = { role: null, teacherTab: "students", studentId: null, studentTab: "points", authStep: null }; render(); }

window.__app = {
    chooseRole(role) { state.role = role; render(); },
    goHome,
    teacherLogin(pwInputId) {
      const val = document.getElementById(pwInputId).value;
      if (val === (settings.teacherPassword || "changeme")) {
        state.role = "teacher-in";
        render();
      } else {
        alert("Falsches Passwort.");
      }
    },
    setTeacherTab(tab) { state.teacherTab = tab; render(); },
    setStudentTab(tab) { state.studentTab = tab; render(); },

    selectStudent(id) {
      state.studentId = id;
      const s = students[id];
      state.authStep = (s && s.password) ? "login" : "setup";
      state.role = "student-auth";
      render();
    },

    studentSetupPassword() {
      const pw1 = document.getElementById("setupPw1").value.trim();
      const pw2 = document.getElementById("setupPw2").value.trim();
      if (!pw1 || pw1.length < 4) return alert("Bitte ein Passwort mit mindestens 4 Zeichen wählen.");
      if (pw1 !== pw2) return alert("Die Passwörter stimmen nicht überein.");
      update(ref(db, "students/" + state.studentId), { password: pw1 });
      state.role = "student-in";
      render();
    },

    studentLogin() {
      const pw = document.getElementById("loginPw").value.trim();
      const s = students[state.studentId];
      if (s && s.password === pw) {
        state.role = "student-in";
        render();
      } else {
        alert("Falsches Passwort.");
      }
    },

    addStudent() {
      const name = document.getElementById("newStudentName").value.trim();
      const points = parseInt(document.getElementById("newStudentPoints").value || "0", 10);
      if (!name) return alert("Bitte einen Namen eingeben.");
      const newRef = push(studentsRef);
      set(newRef, { name, points });
      update(totalStudentPointsRef, { total: (totalStudentPoints.total || 0) + points });
      document.getElementById("newStudentName").value = "";
      document.getElementById("newStudentPoints").value = "0";
    },
    deleteStudent(id) {
      const s = students[id];
      if (confirm("Diesen Schüler wirklich löschen?")) {
        remove(ref(db, "students/" + id));
        if (s) update(totalStudentPointsRef, { total: (totalStudentPoints.total || 0) - (s.points || 0) });
      }
    },
    resetStudentPassword(id) {
      if (confirm("Passwort dieses Schülers wirklich zurücksetzen? Er muss danach ein neues festlegen.")) {
        update(ref(db, "students/" + id), { password: null });
      }
    },

    awardPoints(studentId, categoryKey) {
      const s = students[studentId];
      const cat = settings.categories[categoryKey];
      if (!s || !cat) return;
      const amount = cat.points || 0;
      update(ref(db, "students/" + studentId), { points: (s.points || 0) + amount });
      update(classPointsRef, { total: (classPoints.total || 0) + amount });
      update(totalStudentPointsRef, { total: (totalStudentPoints.total || 0) + amount });
      const logRef = push(pointsLogRef);
      set(logRef, { studentId, studentName: s.name, category: cat.label, amount, timestamp: Date.now() });
    },
    correctPoints(studentId, delta) {
      const s = students[studentId];
      if (!s) return;
      update(ref(db, "students/" + studentId), { points: (s.points || 0) + delta });
      update(classPointsRef, { total: (classPoints.total || 0) + delta });
      update(totalStudentPointsRef, { total: (totalStudentPoints.total || 0) + delta });
      const logRef = push(pointsLogRef);
      set(logRef, { studentId, studentName: s.name, category: "Korrektur", amount: delta, timestamp: Date.now() });
    },

    updateCategoryValue(key, inputId) {
      const val = parseInt(document.getElementById(inputId).value || "0", 10);
      const updated = { ...settings.categories, [key]: { ...settings.categories[key], points: val } };
      update(settingsRef, { categories: updated });
    },

    addReward() {
      const name = document.getElementById("newRewardName").value.trim();
      const points = parseInt(document.getElementById("newRewardPoints").value || "0", 10);
      const desc = document.getElementById("newRewardDesc").value.trim();
      const icon = document.getElementById("newRewardIcon").value;
      if (!name) return alert("Bitte einen Namen eingeben.");
      const newRef = push(rewardsRef);
      set(newRef, { name, points, description: desc, icon });
      document.getElementById("newRewardName").value = "";
      document.getElementById("newRewardPoints").value = "0";
      document.getElementById("newRewardDesc").value = "";
    },
    deleteReward(id) {
      if (confirm("Diese Belohnung wirklich löschen?")) remove(ref(db, "rewards/" + id));
    },

    addGroupReward() {
      const name = document.getElementById("newGroupRewardName").value.trim();
      const points = parseInt(document.getElementById("newGroupRewardPoints").value || "0", 10);
      const desc = document.getElementById("newGroupRewardDesc").value.trim();
      const icon = document.getElementById("newGroupRewardIcon").value;
      if (!name) return alert("Bitte einen Namen eingeben.");
      const newRef = push(groupRewardsRef);
      set(newRef, { name, points, description: desc, icon });
      document.getElementById("newGroupRewardName").value = "";
      document.getElementById("newGroupRewardPoints").value = "0";
      document.getElementById("newGroupRewardDesc").value = "";
    },
    deleteGroupReward(id) {
      if (confirm("Diese Klassen-Belohnung wirklich löschen?")) remove(ref(db, "groupRewards/" + id));
    },
    redeemGroupReward(id) {
      const r = groupRewards[id];
      if (!r) return;
      if ((classPoints.total || 0) < r.points) return alert("Die Klasse hat noch nicht genug Punkte.");
      if (!confirm(`"${r.name}" jetzt einlösen? Es werden ${r.points} Klassenpunkte abgezogen.`)) return;
      update(classPointsRef, { total: (classPoints.total || 0) - r.points });
      alert("Klassen-Belohnung eingelöst!");
    },

    requestReward(studentId, rewardId) {
      const student = students[studentId];
      const reward = rewards[rewardId];
      if (!student || !reward) return;
      if ((student.points || 0) < (reward.points || 0)) return alert("Nicht genug Punkte für diese Belohnung.");
      const newRef = push(requestsRef);
      set(newRef, {
        studentId, studentName: student.name,
        rewardId, rewardName: reward.name, cost: reward.points,
        status: "pending", timestamp: Date.now()
      });
      alert("Anfrage gesendet! Die Lehrkraft muss sie noch bestätigen.");
    },
    approveRequest(id) {
      const r = requests[id];
      if (!r) return;
      const student = students[r.studentId];
      if (student) {
        update(ref(db, "students/" + r.studentId), { points: (student.points || 0) - r.cost });
        update(totalStudentPointsRef, { total: (totalStudentPoints.total || 0) - r.cost });
      }
      update(ref(db, "requests/" + id), { status: "approved" });
    },
    rejectRequest(id) {
      update(ref(db, "requests/" + id), { status: "rejected" });
    },

    changePassword() {
      const val = document.getElementById("newPassword").value.trim();
      if (!val) return alert("Bitte ein neues Passwort eingeben.");
      update(settingsRef, { teacherPassword: val });
      alert("Passwort geändert.");
      document.getElementById("newPassword").value = "";
    },

    savePointsManually() {
      const totalVal = parseInt(document.getElementById("manualTotalPoints").value || "0", 10);
      const classVal = parseInt(document.getElementById("manualClassPoints").value || "0", 10);
      update(totalStudentPointsRef, { total: totalVal });
      update(classPointsRef, { total: classVal });
      alert("Punktestände wurden direkt in der Datenbank gespeichert.");
    },
    recalculateTotalPoints() {
      const sum = Object.values(students).reduce((s, st) => s + (st.points || 0), 0);
      update(totalStudentPointsRef, { total: sum });
      alert("Summe aller Schülerpunkte wurde neu berechnet: " + sum);
    },

    resetAll() {
      if (!confirm("Wirklich ALLE Schüler, Belohnungen, Klassenpunkte und Anfragen löschen? Das kann nicht rückgängig gemacht werden.")) return;
      if (!confirm("Bist du dir wirklich sicher? Letzte Bestätigung.")) return;
      set(studentsRef, null);
      set(rewardsRef, null);
      set(groupRewardsRef, null);
      set(requestsRef, null);
      set(pointsLogRef, null);
      set(classPointsRef, { total: 0 });
      set(totalStudentPointsRef, { total: 0 });
      alert("Klassendaten wurden zurückgesetzt.");
    }
  };

  function renderPodiumAndBars() {
    const sorted = Object.entries(students).sort((a, b) => (b[1].points || 0) - (a[1].points || 0));
    const top3 = sorted.slice(0, 3);
    const maxPoints = sorted.length ? (sorted[0][1].points || 0) : 1;
    const medals = ["🥇", "🥈", "🥉"];
    const podiumOrder = [top3[1], top3[0], top3[2]];

    const podiumHtml = top3.length ? `
      <div class="podium">
        ${podiumOrder.map((entry) => {
          if (!entry) return "";
          const [id, s] = entry;
          const rank = entry === top3[0] ? 1 : entry === top3[1] ? 2 : 3;
          return `
          <div class="podium-item podium-${rank}">
            <div class="medal">${medals[rank - 1]}</div>
            <div class="podium-name">${esc(s.name)}</div>
            <div class="podium-points">${s.points || 0} Pkt.</div>
          </div>`;
        }).join("")}
      </div>` : "";

    const barsHtml = sorted.map(([id, s]) => {
      const pct = maxPoints > 0 ? Math.round(((s.points || 0) / maxPoints) * 100) : 0;
      return `
      <div class="bar-row">
        <div class="bar-label">${esc(s.name)}</div>
        <div class="bar-container"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-value">${s.points || 0}</div>
      </div>`;
    }).join("") || `<p class="small">Noch keine Schüler angelegt.</p>`;

    return `<div class="card"><h3>Bestenliste</h3>${podiumHtml}${barsHtml}</div>`;
  }

  function render() {
    if (!state.role) return renderRoleSelect();
    if (state.role === "teacher-login") return renderTeacherLogin();
    if (state.role === "teacher-in") return renderTeacherDashboard();
    if (state.role === "student-select") return renderStudentSelect();
    if (state.role === "student-auth") return renderStudentAuth();
    if (state.role === "student-in") return renderStudentDashboard();
  }

  function renderRoleSelect() {
    const totalPoints = getTotalPoints();
    const studentCount = Object.keys(students).length;

    const groupGoalsHtml = Object.entries(groupRewards).map(([id, r]) => {
      const pct = Math.min(100, Math.round(((classPoints.total || 0) / r.points) * 100));
      return `
      <div style="margin-bottom:12px;">
        <div class="top-bar" style="margin-bottom:6px;">
          <div>${ICONS[r.icon] || "🎉"} ${esc(r.name)}</div>
          <span class="pill">${classPoints.total || 0} / ${r.points} Pkt.</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join("") || `<p class="small">Die Lehrkraft hat noch kein Klassenziel festgelegt.</p>`;

    app_.innerHTML = `
      <div class="card welcome-card center">
        <div style="font-size:32px;">👋</div>
        <h2 style="margin:6px 0 4px;">Willkommen bei den Klassen-Belohnungen!</h2>
        <p class="small">Hier sehen Eltern und Schüler:innen jederzeit den aktuellen Punktestand und die Klassenziele, ganz ohne Anmeldung.</p>
      </div>

      <div class="card">
        <div class="btn-row" style="justify-content:space-between;">
          <div class="center" style="flex:1;">
            <div style="font-size:26px;font-weight:800;color:var(--teal-dark)">${studentCount}</div>
            <div class="small">Schüler:innen</div>
          </div>
          <div class="center" style="flex:1;">
            <div style="font-size:26px;font-weight:800;color:var(--teal-dark)">${totalPoints}</div>
            <div class="small">Punkte gesamt</div>
          </div>
          <div class="center" style="flex:1;">
            <div style="font-size:26px;font-weight:800;color:var(--orange)">${classPoints.total || 0}</div>
            <div class="small">Klassenpunkte</div>
          </div>
        </div>
      </div>

      ${renderPodiumAndBars()}

      <div class="card">
        <h3>Unsere Klassenziele</h3>
        ${groupGoalsHtml}
      </div>

      <div class="card center">
        <p style="font-weight:600;">Wer bist du?</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn" onclick="__app.chooseRole('teacher-login')">Ich bin Lehrkraft</button>
          <button class="btn secondary" onclick="__app.chooseRole('student-select')">Ich bin Schüler/in</button>
        </div>
      </div>`;
  }

  function renderTeacherLogin() {
    app_.innerHTML = `
      <div class="card">
        <div class="top-bar"><button class="btn secondary" onclick="__app.goHome()">Zurück</button></div>
        <label>Lehrkraft-Passwort</label>
        <input type="password" id="teacherPw" placeholder="Passwort eingeben" />
        <button class="btn" onclick="__app.teacherLogin('teacherPw')">Anmelden</button>
        <p class="small">Standard-Passwort beim ersten Start: changeme</p>
      </div>`;
  }

  function renderStudentSelect() {
    const rows = Object.entries(students).map(([id, s]) => `
      <div class="list-item" style="cursor:pointer" onclick="__app.selectStudent('${id}')">
        <div><strong>${esc(s.name)}</strong></div>
        <span class="pill">${s.points || 0} Pkt.</span>
      </div>`).join("") || `<p class="small">Die Lehrkraft hat noch keine Schüler angelegt.</p>`;

    app_.innerHTML = `
      <div class="top-bar"><button class="btn secondary" onclick="__app.goHome()">Zurück</button></div>
      <div class="card">
        <h3>Wer bist du?</h3>
        ${rows}
      </div>`;
  }

  function renderStudentAuth() {
    const s = students[state.studentId];
    if (!s) { goHome(); return; }

    if (state.authStep === "setup") {
      app_.innerHTML = `
        <div class="card">
          <div class="top-bar"><button class="btn secondary" onclick="__app.goHome()">Zurück</button></div>
          <h3>Willkommen, ${esc(s.name)}!</h3>
          <p class="small">Du hast noch kein Passwort. Lege jetzt eins fest.</p>
          <label>Neues Passwort</label>
          <input type="password" id="setupPw1" placeholder="Mindestens 4 Zeichen" />
          <label>Passwort wiederholen</label>
          <input type="password" id="setupPw2" placeholder="Passwort bestätigen" />
          <button class="btn" onclick="__app.studentSetupPassword()">Passwort festlegen</button>
        </div>`;
    } else {
      app_.innerHTML = `
        <div class="card">
          <div class="top-bar"><button class="btn secondary" onclick="__app.goHome()">Zurück</button></div>
          <h3>Hallo, ${esc(s.name)}!</h3>
          <label>Dein Passwort</label>
          <input type="password" id="loginPw" placeholder="Passwort eingeben" />
          <button class="btn" onclick="__app.studentLogin()">Anmelden</button>
          <p class="small">Passwort vergessen? Frag deine Lehrkraft, sie kann es zurücksetzen.</p>
        </div>`;
    }
  }

function renderTeacherDashboard() {
    const tab = state.teacherTab;
    const totalPoints = getTotalPoints();
    app_.innerHTML = `
      <div class="top-bar">
        <strong>Lehrkraft-Bereich</strong>
        <button class="btn secondary" onclick="__app.goHome()">Abmelden</button>
      </div>
      <div class="card center">
        <div style="font-size:32px;font-weight:800;color:var(--teal-dark)">${totalPoints}</div>
        <div class="small">Summe aller Schülerpunkte</div>
      </div>
      <div class="card center">
        <div style="font-size:28px;font-weight:800;color:var(--teal-dark)">${classPoints.total || 0}</div>
        <div class="small">Gemeinsame Klassenpunkte</div>
      </div>
      <div class="tabs">
        <div class="tab ${tab==='students'?'active':''}" onclick="__app.setTeacherTab('students')">Schüler</div>
        <div class="tab ${tab==='rewards'?'active':''}" onclick="__app.setTeacherTab('rewards')">Belohnungen</div>
        <div class="tab ${tab==='requests'?'active':''}" onclick="__app.setTeacherTab('requests')">Anfragen</div>
        <div class="tab ${tab==='settings'?'active':''}" onclick="__app.setTeacherTab('settings')">Einstellungen</div>
      </div>
      <div id="teacherContent"></div>`;
    const content = document.getElementById("teacherContent");

    if (tab === "students") {
      const categories = settings.categories || defaultCategories;
      const rows = Object.entries(students).map(([id, s]) => `
        <div class="card">
          <div class="top-bar">
            <div>
              <strong>${esc(s.name)}</strong>
              <div class="small">${s.points || 0} Punkte ${s.password ? "· Passwort gesetzt" : "· Kein Passwort"}</div>
            </div>
            <button class="btn danger small-btn" onclick="__app.deleteStudent('${id}')">Löschen</button>
          </div>
          <div class="btn-row">
            ${Object.entries(categories).map(([key, cat]) => `
              <button class="btn secondary small-btn" onclick="__app.awardPoints('${id}', '${key}')">${esc(cat.label)} +${cat.points}</button>`).join("")}
          </div>
          <div class="btn-row" style="margin-top:6px;">
            <button class="btn secondary small-btn" onclick="__app.correctPoints('${id}', -1)">Korrektur -1</button>
            <button class="btn secondary small-btn" onclick="__app.correctPoints('${id}', 1)">Korrektur +1</button>
            ${s.password ? `<button class="btn secondary small-btn" onclick="__app.resetStudentPassword('${id}')">Passwort zurücksetzen</button>` : ""}
          </div>
        </div>`).join("") || `<p class="small">Noch keine Schüler angelegt.</p>`;

      content.innerHTML = `
        ${renderPodiumAndBars()}
        <div class="card"><h3>Schüler:innen</h3></div>
        ${rows}
        <div class="card">
          <h3>Neuen Schüler hinzufügen</h3>
          <label>Name / Spitzname</label>
          <input id="newStudentName" placeholder="z. B. Mia" />
          <label>Start-Punkte</label>
          <input id="newStudentPoints" type="number" value="0" />
          <button class="btn" onclick="__app.addStudent()">Hinzufügen</button>
        </div>`;
    }

    if (tab === "rewards") {
      const rows = Object.entries(rewards).map(([id, r]) => `
        <div class="reward-card">
          <div class="reward-icon">${ICONS[r.icon] || "🎁"}</div>
          <div class="top-bar">
            <div class="reward-title">${esc(r.name)}</div>
            <span class="pill">${r.points} Pkt.</span>
          </div>
          <div class="reward-desc">${esc(r.description || "")}</div>
          <button class="btn danger" onclick="__app.deleteReward('${id}')">Löschen</button>
        </div>`).join("") || `<p class="small">Noch keine Belohnungen angelegt.</p>`;

      const groupRows = Object.entries(groupRewards).map(([id, r]) => {
        const pct = Math.min(100, Math.round(((classPoints.total || 0) / r.points) * 100));
        const enough = (classPoints.total || 0) >= r.points;
        return `
        <div class="group-reward-card">
          <div class="reward-icon">${ICONS[r.icon] || "🎉"}</div>
          <div class="top-bar">
            <div class="reward-title">${esc(r.name)}</div>
            <span class="pill">${r.points} Klassen-Pkt.</span>
          </div>
          <div class="reward-desc">${esc(r.description || "")}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="small">${classPoints.total || 0} / ${r.points} Punkten (${pct}%)</div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" ${enough ? "" : "disabled"} onclick="__app.redeemGroupReward('${id}')">Einlösen</button>
            <button class="btn danger" onclick="__app.deleteGroupReward('${id}')">Löschen</button>
          </div>
        </div>`;
      }).join("") || `<p class="small">Noch keine Klassen-Belohnungen angelegt.</p>`;

      content.innerHTML = `
        <div class="card"><h3>Geschenkeladen (pro Schüler)</h3>${rows}</div>
        <div class="card">
          <h3>Neue Belohnung hinzufügen</h3>
          <label>Name</label>
          <input id="newRewardName" placeholder="z. B. Stifte-Set" />
          <label>Punktepreis</label>
          <input id="newRewardPoints" type="number" value="10" />
          <label>Beschreibung</label>
          <textarea id="newRewardDesc" rows="2" placeholder="Kurze Beschreibung"></textarea>
          <label>Icon auswählen</label>
          <select id="newRewardIcon">${iconOptions("gift")}</select>
          <button class="btn" onclick="__app.addReward()">Hinzufügen</button>
        </div>
        <div class="card"><h3>Belohnungen/Aktivitäten für die ganze Klasse</h3>${groupRows}</div>
        <div class="card">
          <h3>Neue Klassen-Belohnung hinzufügen</h3>
          <label>Name</label>
          <input id="newGroupRewardName" placeholder="z. B. Kino-Nachmittag" />
          <label>Benötigte Klassenpunkte</label>
          <input id="newGroupRewardPoints" type="number" value="300" />
          <label>Beschreibung</label>
          <textarea id="newGroupRewardDesc" rows="2" placeholder="Kurze Beschreibung"></textarea>
          <label>Icon auswählen</label>
          <select id="newGroupRewardIcon">${iconOptions("movie")}</select>
          <button class="btn" onclick="__app.addGroupReward()">Hinzufügen</button>
        </div>`;
    }

    if (tab === "requests") {
      const entries = Object.entries(requests).sort((a,b) => (b[1].timestamp||0)-(a[1].timestamp||0));
      const rows = entries.map(([id, r]) => `
        <div class="list-item">
          <div>
            <div><strong>${esc(r.studentName)}</strong> möchte: ${esc(r.rewardName)} (${r.cost} Pkt.)</div>
            <div class="small status-${r.status}">${r.status === 'pending' ? 'Offen' : r.status === 'approved' ? 'Bestätigt' : 'Abgelehnt'}</div>
            <div class="small">${formatDate(r.timestamp)}</div>
          </div>
          ${r.status === 'pending' ? `
            <div class="btn-row">
              <button class="btn" onclick="__app.approveRequest('${id}')">Bestätigen</button>
              <button class="btn danger" onclick="__app.rejectRequest('${id}')">Ablehnen</button>
            </div>` : ``}
        </div>`).join("") || `<p class="small">Keine Anfragen vorhanden.</p>`;

      content.innerHTML = `<div class="card"><h3>Einlöse-Anfragen</h3>${rows}</div>`;
    }

    if (tab === "settings") {
      const categories = settings.categories || defaultCategories;
      const catRows = Object.entries(categories).map(([key, cat]) => `
        <div class="list-item">
          <div>${esc(cat.label)}</div>
          <div class="btn-row" style="align-items:center;">
            <input id="cat_${key}" type="number" value="${cat.points}" style="width:70px;margin:0;" />
            <button class="btn secondary small-btn" onclick="__app.updateCategoryValue('${key}', 'cat_${key}')">Speichern</button>
          </div>
        </div>`).join("");

      content.innerHTML = `
        <div class="card"><h3>Punktekategorien anpassen</h3>${catRows}</div>
        <div class="card">
          <h3>Punktestände manuell anpassen</h3>
          <p class="small">Diese Werte werden direkt in der Datenbank gespeichert und bei jeder weiteren Punktevergabe/Korrektur automatisch mitgeführt.</p>
          <label>Summe aller Schülerpunkte</label>
          <input id="manualTotalPoints" type="number" value="${totalPoints}" />
          <label>Gemeinsame Klassenpunkte</label>
          <input id="manualClassPoints" type="number" value="${classPoints.total || 0}" />
          <button class="btn" onclick="__app.savePointsManually()">Beide Werte speichern</button>
          <button class="btn secondary" style="margin-top:8px;" onclick="__app.recalculateTotalPoints()">Summe aus Schülerpunkten neu berechnen</button>
        </div>
        <div class="card">
          <h3>Lehrkraft-Passwort ändern</h3>
          <input id="newPassword" type="password" placeholder="Neues Passwort" />
          <button class="btn" onclick="__app.changePassword()">Passwort speichern</button>
        </div>
        <div class="card">
          <h3>Klassendaten zurücksetzen</h3>
          <p class="small">Löscht alle Schüler, Belohnungen, Klassenpunkte und Anfragen unwiderruflich.</p>
          <button class="btn danger" onclick="__app.resetAll()">Alles zurücksetzen</button>
        </div>`;
    }
  }

function renderStudentDashboard() {
    const student = students[state.studentId];
    if (!student) { goHome(); return; }
    const tab = state.studentTab;

    app_.innerHTML = `
      <div class="top-bar">
        <div><strong>${esc(student.name)}</strong><div class="small">${student.points || 0} Punkte</div></div>
        <button class="btn secondary" onclick="__app.goHome()">Abmelden</button>
      </div>
      <div class="tabs">
        <div class="tab ${tab==='points'?'active':''}" onclick="__app.setStudentTab('points')">Punktestand</div>
        <div class="tab ${tab==='history'?'active':''}" onclick="__app.setStudentTab('history')">Verlauf</div>
        <div class="tab ${tab==='rewards'?'active':''}" onclick="__app.setStudentTab('rewards')">Geschenkeladen</div>
        <div class="tab ${tab==='group'?'active':''}" onclick="__app.setStudentTab('group')">Klassenziele</div>
      </div>
      <div id="studentContent"></div>`;

    const content = document.getElementById("studentContent");

    if (tab === "points") {
      const myRequests = Object.entries(requests)
        .filter(([_, r]) => r.studentId === state.studentId)
        .sort((a,b) => (b[1].timestamp||0)-(a[1].timestamp||0));
      const reqRows = myRequests.map(([id, r]) => `
        <div class="list-item">
          <div>
            <div>${esc(r.rewardName)} (${r.cost} Pkt.)</div>
            <div class="small">${formatDate(r.timestamp)}</div>
          </div>
          <span class="small status-${r.status}">${r.status === 'pending' ? 'Offen' : r.status === 'approved' ? 'Bestätigt' : 'Abgelehnt'}</span>
        </div>`).join("") || `<p class="small">Noch keine Anfragen.</p>`;

      content.innerHTML = `
        <div class="card center">
          <div style="font-size:40px;font-weight:800;color:var(--teal-dark)">${student.points || 0}</div>
          <div class="small">Meine Punkte</div>
        </div>
        <div class="card">
          <h3>Meine Einlöse-Anfragen</h3>
          ${reqRows}
        </div>`;
    }

    if (tab === "history") {
      const myLog = Object.entries(pointsLog)
        .filter(([_, l]) => l.studentId === state.studentId)
        .sort((a,b) => (b[1].timestamp||0)-(a[1].timestamp||0));
      const logRows = myLog.map(([id, l]) => `
        <div class="list-item">
          <div>
            <div><strong>${esc(l.category)}</strong> ${l.amount > 0 ? "+" : ""}${l.amount} Pkt.</div>
            <div class="small">${formatDate(l.timestamp)}</div>
          </div>
        </div>`).join("") || `<p class="small">Noch keine Punkte-Historie vorhanden.</p>`;

      content.innerHTML = `
        <div class="card">
          <h3>Woher kommen meine Punkte?</h3>
          ${logRows}
        </div>`;
    }

    if (tab === "rewards") {
      const cards = Object.entries(rewards).map(([id, r]) => {
        const enough = (student.points || 0) >= (r.points || 0);
        return `
        <div class="reward-card">
          <div class="reward-icon">${ICONS[r.icon] || "🎁"}</div>
          <div class="top-bar">
            <div class="reward-title">${esc(r.name)}</div>
            <span class="pill">${r.points} Pkt.</span>
          </div>
          <div class="reward-desc">${esc(r.description || "")}</div>
          <button class="btn" ${enough ? "" : "disabled"} onclick="__app.requestReward('${state.studentId}', '${id}')">
            ${enough ? "Einlösen" : "Nicht genug Punkte"}
          </button>
        </div>`;
      }).join("") || `<p class="small">Noch keine Belohnungen vorhanden.</p>`;

      content.innerHTML = `<div class="card"><h3>Geschenkeladen</h3>${cards}</div>`;
    }

    if (tab === "group") {
      const groupCards = Object.entries(groupRewards).map(([id, r]) => {
        const pct = Math.min(100, Math.round(((classPoints.total || 0) / r.points) * 100));
        return `
        <div class="group-reward-card">
          <div class="reward-icon">${ICONS[r.icon] || "🎉"}</div>
          <div class="top-bar">
            <div class="reward-title">${esc(r.name)}</div>
            <span class="pill">${r.points} Klassen-Pkt.</span>
          </div>
          <div class="reward-desc">${esc(r.description || "")}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="small">${classPoints.total || 0} / ${r.points} Punkten (${pct}%)</div>
        </div>`;
      }).join("") || `<p class="small">Noch keine Klassenziele vorhanden.</p>`;

      content.innerHTML = `
        <div class="card center">
          <div style="font-size:28px;font-weight:800;color:var(--teal-dark)">${classPoints.total || 0}</div>
          <div class="small">Gemeinsame Klassenpunkte</div>
        </div>
        <div class="card">
          <h3>Ziele für die ganze Klasse</h3>
          ${groupCards}
        </div>`;
    }
  }

  render();
</script>
</body>
</html>
